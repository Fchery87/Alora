name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run format

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:coverage

  expo-compatibility:
    name: Expo compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo install --check

  dependency-audit:
    name: Dependency audit (advisory)
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run audit

  exports:
    name: Expo export (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run export:${{ matrix.platform }}

  backend:
    name: Backend contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno task check
        working-directory: backend
      - run: deno task test
        working-directory: backend

  pgtap-hosted:
    name: Hosted pgTAP security suite
    if: ${{ secrets.PGLTAP_DATABASE_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y postgresql-client
      - name: Run the explicitly dedicated remote suite
        env:
          PGLTAP_DATABASE_URL: ${{ secrets.PGLTAP_DATABASE_URL }}
          PGLTAP_REMOTE_CONFIRM: I_UNDERSTAND_THIS_IS_A_DEDICATED_TEST_DATABASE
          PGPASSWORD: ${{ secrets.PGLTAP_DATABASE_PASSWORD }}
        run: ./backend/tests/run-pgtap.sh

  ci-ok:
    name: CI gate
    needs: [format, typecheck, lint, test, exports, backend, expo-compatibility]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.format.result }}" != "success" ]]; then echo "format failed"; exit 1; fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then echo "typecheck failed"; exit 1; fi
          if [[ "${{ needs.lint.result }}" != "success" ]]; then echo "lint failed"; exit 1; fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then echo "tests failed"; exit 1; fi
          if [[ "${{ needs.exports.result }}" != "success" ]]; then echo "exports failed"; exit 1; fi
          if [[ "${{ needs.backend.result }}" != "success" ]]; then echo "backend checks failed"; exit 1; fi
          if [[ "${{ needs.expo-compatibility.result }}" != "success" ]]; then echo "Expo compatibility failed"; exit 1; fi
          echo "All CI checks passed"
